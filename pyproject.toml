[tool.ruff]
target-version = "py39"
line-length = 100
src = ["."]
exclude = [".audit_venv", ".venv", "venv", "__pycache__"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
# Align with prior phases: default Ruff rule set + explicit line-length via [tool.ruff].
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# Long embedded system / prompt strings
"core/gemini_client.py" = ["E501"]
