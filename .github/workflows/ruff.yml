# Phase 5: keep Ruff (format + lint) green on every push/PR.
name: Ruff

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install "ruff>=0.15.12,<0.16"

      - name: Ruff format (check only)
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .
